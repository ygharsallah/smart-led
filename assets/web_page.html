<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Smart LED Controller</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 24px;
            display: grid;
            place-items: center;
            font-family: Arial, sans-serif;
            color: #333333;
            background: #f4f4f4;
        }

        main {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            background: #ffffff;
            border-radius: 6px;
        }

        h1 {
            margin: 6px 0 10px;
            font-size: 1.7rem;
            font-weight: 700;
            letter-spacing: -0.03em;
        }

        p {
            margin: 0 0 24px;
            color: #666666;
            line-height: 1.5;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #555555;
            font-size: .9rem;
            font-weight: 700;
        }

        .color_control {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
        }

        #color_wheel {
            width: 112px;
            height: 112px;
            flex: 0 0 112px;
            border-radius: 50%;
            background: conic-gradient(
                #ff0000, #ffff00, #00ff00, #00ffff,
                #0000ff, #ff00ff, #ff0000
            );
            cursor: pointer;
            touch-action: none;
            position: relative;
        }

        #color_wheel::after {
            content: "";
            position: absolute;
            top: calc(50% + var(--marker_y, -44px));
            left: calc(50% + var(--marker_x, 0px));
            width: 18px;
            height: 18px;
            border: 3px solid white;
            border-radius: 50%;
            box-shadow: 0 0 0 1px #333333;
            transform: translate(-50%, -50%);
            pointer-events: none;
        }

        #color_input {
            position: absolute;
            width: 1px;
            height: 1px;
            opacity: 0;
            pointer-events: none;
        }

        #preview {
            height: 100px;
            margin: 20px 0;
            border-radius: 4px;
            background: #2563eb;
        }

        button {
            width: 100%;
            padding: 12px;
            border: 0;
            border-radius: 4px;
            font: inherit;
            font-weight: 600;
            background: #555555;
            color: white;
            cursor: pointer;
        }

        button:hover { background: #444444; }
        button:disabled { opacity: .6; cursor: wait; }
        button:focus-visible {
            outline: none;
        }

        .connected {
            color: #198754;
            font-size: .8rem;
            font-weight: 700;
        }

    </style>
</head>
<body>
    <main>
        <span class="connected">Verbunden mit Smart LED</span>
        <h1>Smart LED Controller</h1>

        <p>Wähle eine Farbe und klicke auf "Farbe festlegen".</p>

        <form id="color_form" action="/message" method="post">


            <div class="color_control">
                <div id="color_wheel" role="img" aria-label="LED-Farbe auswählen"></div>
                <input type="hidden" id="color_input" name="message" value="#2563eb">
            </div>

            <div id="preview" role="img" aria-label="Ausgewählte Farbe: #2563EB"></div>
            <button id="send" type="submit">Farbe festlegen</button>
        </form>
    </main>

    <script>
        const form = document.getElementById("color_form");
        const wheel = document.getElementById("color_wheel");
        const color_input = document.getElementById("color_input");
        const preview = document.getElementById("preview");
        const send_button = document.getElementById("send");
        let hue = 216;
        let has_unsent_color = false;
        let color_request_id = 0;

        function color_from_hue(value) {
            const normalized_hue = ((value % 360) + 360) % 360;
            const sector = normalized_hue / 60;
            const channel = 255;
            const secondary = Math.round(channel * (1 - Math.abs(sector % 2 - 1)));
            const channels = [
                [channel, secondary, 0], [secondary, channel, 0],
                [0, channel, secondary], [0, secondary, channel],
                [secondary, 0, channel], [channel, 0, secondary]
            ][Math.floor(sector)];
            return "#" + channels.map((part) => part.toString(16).padStart(2, "0")).join("");
        }

        function hue_from_color(color) {
            const red = parseInt(color.slice(1, 3), 16);
            const green = parseInt(color.slice(3, 5), 16);
            const blue = parseInt(color.slice(5, 7), 16);
            const maximum = Math.max(red, green, blue);
            const difference = maximum - Math.min(red, green, blue);
            if (difference === 0) return hue;
            if (maximum === red) return 60 * ((green - blue) / difference);
            if (maximum === green) return 60 * ((blue - red) / difference + 2);
            return 60 * ((red - green) / difference + 4);
        }

        function update_color(value, color = color_from_hue(value)) {
            hue = ((value % 360) + 360) % 360;
            color_input.value = color.toLowerCase();
            preview.style.backgroundColor = color;
            wheel.setAttribute("aria-label", "LED-Farbe: " + color.toUpperCase());
            preview.setAttribute("aria-label", "Ausgewählte Farbe: " + color.toUpperCase());
            const angle = (hue - 90) * Math.PI / 180;
            wheel.style.setProperty("--marker_x", Math.cos(angle) * 44 + "px");
            wheel.style.setProperty("--marker_y", Math.sin(angle) * 44 + "px");
        }

        function set_hue_from_pointer(event) {
            has_unsent_color = true;
            const bounds = wheel.getBoundingClientRect();
            const angle = Math.atan2(
                event.clientY - (bounds.top + bounds.height / 2),
                event.clientX - (bounds.left + bounds.width / 2)
            );
            update_color((angle * 180 / Math.PI + 90 + 360) % 360);
        }

        wheel.addEventListener("pointerdown", (event) => {
            wheel.setPointerCapture(event.pointerId);
            set_hue_from_pointer(event);
        });

        wheel.addEventListener("pointermove", (event) => {
            if (wheel.hasPointerCapture(event.pointerId)) set_hue_from_pointer(event);
        });

        update_color(hue);

        form.addEventListener("submit", async (event) => {
            event.preventDefault();
            if (window.location.protocol === "file:") {
                return;
            }

            const selected_color = color_input.value;
            send_button.disabled = true;
            const controller = new AbortController();
            const timeout = setTimeout(() => controller.abort(), 8000);

            try {
                const response = await fetch(form.action, {
                    method: "POST",
                    body: new URLSearchParams({ message: selected_color }),
                    signal: controller.signal
                });

                if (!response.ok) {
                    throw new Error(await response.text());
                }

                if (color_input.value === selected_color) {
                    has_unsent_color = false;
                }
            } catch (error) {
                console.error("Farbe konnte nicht gesendet werden:", error);
            } finally {
                clearTimeout(timeout);
                send_button.disabled = false;
            }
        });
    </script>
</body>
</html>
